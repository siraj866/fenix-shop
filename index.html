
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FenixMC Store</title>
<style>
:root{--bg:#17161b;--panel:#242228;--panel2:#2c2930;--orange:#ff922d;--gold:#e8b72b;--red:#ef393d;--text:#f5f3f5;--muted:#aaa6ae}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Arial,sans-serif}
button{font:inherit;cursor:pointer}
.hero{height:390px;position:relative;text-align:center;overflow:hidden;background:linear-gradient(#17161b55,#17161bdf),radial-gradient(ellipse at 50% 8%,#7b4a43,#38302f 43%,#17161b 80%)}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,#d28c79 0,transparent 40%);opacity:.3}
.topbar{position:absolute;right:15px;top:16px;z-index:2}
.topbar button{background:#29262dcc;border:1px solid #ffffff22;color:#fff;padding:8px 12px;border-radius:5px}
.logo{position:relative;padding-top:66px}
.mascot{font-size:75px;line-height:1.1;filter:drop-shadow(0 6px 5px #0009)}
.brand{font-size:clamp(46px,12vw,78px);font-weight:1000;letter-spacing:-4px;color:#ffad32;text-shadow:0 4px #d34b0c,0 8px #8f2c0b,3px 12px 12px #000;transform:skew(-5deg)}
.stats{position:relative;display:flex;justify-content:center;gap:110px;margin-top:24px}
.stat{display:flex;align-items:center;flex-direction:column;gap:8px;color:var(--orange)}
.pill{background:#ff9700;color:#211a15;border-radius:24px;padding:5px 14px;font-weight:bold;font-size:17px}
.social{width:53px;height:53px;border-radius:12px;background:#ff9700;color:#211a15;display:grid;place-items:center;font-size:28px}
.wrap{max-width:950px;margin:auto;padding:0 13px}
.panel{background:var(--panel);border-radius:7px;padding:20px;margin:14px 0 22px}
.category{display:flex;align-items:center;gap:18px;border:0;background:transparent;color:var(--orange);font-size:19px;font-weight:bold;text-align:left;width:100%;padding:4px 10px}
.category .symbol{font-size:30px;line-height:1}
.menu{margin:20px -20px -20px;border-top:1px solid #ffffff08}
.menu[hidden]{display:none}
.menu-item{width:100%;display:flex;align-items:center;gap:22px;text-align:left;border:0;border-bottom:1px solid #ffffff08;background:transparent;color:#aaa6af;padding:21px 20px;font-size:18px;font-weight:bold;letter-spacing:.4px}
.menu-item:hover,.menu-item.active{background:#302d34;color:#fff}
.menu-icon{width:70px;min-width:70px;text-align:center;font-size:49px;line-height:1.1}
.section-title{font-size:22px;letter-spacing:1.4px;margin:0 0 17px;color:#f5f3f5}
.products{display:grid;grid-template-columns:1fr;gap:13px}
.product{width:100%;display:flex;align-items:center;gap:20px;text-align:left;color:#fff;border:3px solid var(--gold);border-radius:9px;padding:15px;background:#261b1a;min-height:150px;box-shadow:0 0 8px color-mix(in srgb,var(--edge) 40%,transparent);transition:filter .15s,transform .15s}
.product:hover{filter:brightness(1.15);transform:translateY(-2px)}
.product.red{--edge:#f02f36;border-color:#f02f36;background:#2b1012;box-shadow:0 0 8px #f02f3680}
.product.orange{--edge:#ff8b20;border-color:#ff8b20;background:#2b1b10;box-shadow:0 0 8px #ff8b2070}
.product.gold{--edge:#e9b82d;border-color:#e9b82d;background:#292313;box-shadow:0 0 8px #e9b82d65}
.product.green{--edge:#65ef3a;border-color:#65ef3a;background:#172716}
.product-icon{width:115px;min-width:115px;height:115px;display:grid;place-items:center;font-size:75px}
.pname{font-size:clamp(18px,4.6vw,25px);font-weight:bold;line-height:1.45}
.price{font-size:20px;font-weight:bold;margin-top:7px}
.desc{color:#c9c4cb;font-size:13px;margin-top:4px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.show{display:flex}
.dialog{width:min(460px,100%);background:#25222a;border:1px solid #514b55;border-radius:9px;padding:22px;position:relative}
.close{position:absolute;right:12px;top:8px;background:none;border:0;color:#fff;font-size:26px}
.dialog h2{color:var(--orange);margin:5px 30px 8px 0}
.dialog p{color:#ccc}
.primary,.secondary{width:100%;padding:11px;border-radius:5px;margin-top:8px;font-weight:bold}
.primary{background:var(--orange);border:0;color:#211b16}
.secondary{background:#393640;border:1px solid #514c58;color:white}
.notice{text-align:center;color:var(--muted);font-size:12px;padding:16px}
.checkbox-container { margin: 12px 0; text-align: left; background: #1b191e; padding: 10px; border-radius: 6px; }
.checkbox-container label { display: flex; gap: 8px; font-size: 13px; color: #ddd; margin-bottom: 6px; cursor: pointer; align-items: flex-start; }
.dialog input[type="text"] { width: 100%; padding: 10px; margin: 12px 0; background: #17161b; border: 1px solid #514b55; color: white; border-radius: 5px; }
.pay-btn { background: #22c55e; color: black; width: 100%; padding: 12px; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 8px; font-size: 15px; text-decoration: none; display: block; text-align: center;}
@media(min-width:650px){
.products{grid-template-columns:1fr 1fr}
.product{min-height:160px}
.hero{height:430px}
}
</style>
</head>
<body>
<header class="hero">
 <div class="topbar"><button id="profileBtn">👤 Click to Login</button></div>
 <div class="logo">
  <div class="mascot">🐉</div>
  <div class="brand">FenixMC</div>
 </div>
 <div class="stats">
  <div class="stat"><span class="pill">3,768</span><span class="social">☏</span></div>
  <div class="stat"><span class="pill">557</span><span class="social">♨</span></div>
 </div>
</header>
<main class="wrap">
 <section class="panel">
  <button class="category" id="category" aria-expanded="false">
   <span class="symbol" id="menuSymbol">☰</span>
   <span>SELECT A CATEGORY</span>
  </button>
  <div class="menu" id="menu" hidden>
   <button class="menu-item" data-group="Fenix+"><span class="menu-icon">🔥</span><span>Fenix+ Membership</span></button>
   <button class="menu-item" data-group="Coins"><span class="menu-icon">🪙</span><span>Coins Store</span></button>
   <button class="menu-item" data-group="Lifesteal Ranks"><span class="menu-icon">⚔️</span><span>Lifesteal Ranks</span></button>
   <button class="menu-item" data-group="Survival Ranks"><span class="menu-icon">🛡️</span><span>Survival Ranks</span></button>
  </div>
 </section>
 <section class="panel">
  <h2 class="section-title" id="title">FEATURED PACKAGES</h2>
  <div class="products" id="products"></div>
 </section>
 <div class="notice">FenixMC Store · Direct UPI Payment & Live Discord Logging</div>
</main>

<!-- Main Action Modal -->
<div class="modal" id="modal" role="dialog" aria-modal="true">
 <div class="dialog">
  <button class="close" id="close">×</button>
  <div id="dIcon" style="font-size:50px">🎁</div>
  <h2 id="dName">Package</h2>
  <div id="dPrice" style="font-weight:bold;font-size:20px;color:var(--gold)"></div>
  <p id="dDesc" style="margin-top:6px;">Package details.</p>
  
  <div id="checkoutStep" style="display:none;">
   <div class="checkbox-container">
    <label><input type="checkbox" id="cb1"> I agree with Terms and Conditions of this store.</label>
    <label><input type="checkbox" id="cb2"> I confirm that I am either over 16 or have guardian permission.</label>
    <label><input type="checkbox" id="cb3"> I verify that the Minecraft account belongs to me.</label>
   </div>
   <h4 style="color:var(--orange); margin-bottom:6px; font-size:14px;">Select Payment Gateway:</h4>
   <a id="upiPayLink" href="#" class="pay-btn" onclick="triggerDiscordOrder()" target="_blank">⚡ Pay via GPay / PhonePe / Paytm (Direct UPI)</a>
  </div>

  <button class="primary" id="buy">Continue to checkout</button>
  <button class="secondary" id="back">Back to store</button>
 </div>
</div>

<!-- Login Modal -->
<div class="modal" id="loginModal" role="dialog" aria-modal="true">
 <div class="dialog">
  <button class="close" id="closeLogin">×</button>
  <h2 style="color:var(--orange)">Player Login</h2>
  <p>Please enter your Minecraft in-game username to continue shopping.</p>
  <input type="text" id="usernameInput" placeholder="Enter your in-game name...">
  <button class="primary" id="saveLoginBtn">LOGIN</button>
 </div>
</div>

<script>
const item=(name,price,icon,color,description)=>({name,price,icon,color,description});

const fenixPlus=[
 item('Fenix+ · 1 Month','₹600','🔥','orange','Fenix+ membership for 1 month with exclusive perks.'),
 item('Fenix+ · 2 Months','₹1100','🔥','orange','Fenix+ membership for 2 months with special tag.'),
 item('Fenix+ · Permanent','₹2500','🔥','orange','Permanent Fenix+ VIP membership (Lifetime access).')
];

const coinsStore=[
 item('1400 Coins','₹40','🪙','gold','1400 Coins / ₹40. Use /coinshop in-game to spend coins.'),
 item('3600 Coins','₹80','🪙','gold','3600 Coins / ₹80. Use /coinshop in-game to spend coins.'),
 item('7700 Coins','₹180','🪙','gold','7700 Coins / ₹180. Use /coinshop in-game to spend coins.'),
 item('12560 Coins','₹370','🪙','gold','12560 Coins / ₹370. Use /coinshop in-game to spend coins.'),
 item('15900 Coins','₹500','🪙','gold','15900 Coins / ₹500. Use /coinshop in-game to spend coins.'),
 item('18600 Coins','₹700','🪙','gold','18600 Coins / ₹700. Use /coinshop in-game to spend coins.')
];

const survival=[
 item('Ultimate Rank','₹700','👑','orange','Ultimate rank for Survival. Full server perks included.'),
 item('Supreme Rank','₹500','🔥','orange','Supreme rank for Survival. High-tier perks included.'),
 item('Titan Rank','₹400','⚔️','red','Titan rank for Survival server.'),
 item('Knight Rank','₹300','🛡️','red','Knight rank for Survival server.')
];

const lifesteal=[
 item('Lord Rank','₹1200','👑','red','Lord rank for Lifesteal server. Ultimate kits & permissions.'),
 item('Boss Rank','₹1000','💀','red','Boss rank for Lifesteal server.'),
 item('Ace Rank','₹800','🔥','red','Ace rank for Lifesteal server.'),
 item('Draxen Rank','₹650','🏆','red','Draxen rank for Lifesteal server.'),
 item('Master Rank','₹400','⚡','red','Master rank for Lifesteal server.')
];

const groups={
 'Fenix+':fenixPlus,
 'Coins':coinsStore,
 'Survival Ranks':survival,
 'Lifesteal Ranks':lifesteal
};

let loggedUser = "";
let selected=null;
const $=id=>document.getElementById(id);

function render(group='Featured'){
 $('title').textContent=group==='Featured'?'FEATURED PACKAGES':group.toUpperCase();
 let items=group==='Featured'?
 [lifesteal[0],survival[0],coinsStore[4],fenixPlus[0]]:
 groups[group];
 
 $('products').innerHTML=items.map((it,i)=>`
 <button class="product ${it.color}" data-i="${i}">
  <span class="product-icon">${it.icon}</span>
  <span><span class="pname">${it.name}</span><br><span class="price">${it.price}</span></span>
 </button>`).join('');
 
 [...$('products').querySelectorAll('.product')].forEach((b,i)=>b.addEventListener('click',()=>open(items[i])));
}

function open(it){
 if(!loggedUser){
  alert("Please click on 'Click to Login' at the top right and enter your Minecraft username first!");
  $('loginModal').classList.add('show');
  return;
 }
 selected=it;
 $('dIcon').textContent=it.icon;
 $('dName').textContent=it.name;
 $('dPrice').textContent=it.price;
 $('dDesc').textContent=it.description;
 $('checkoutStep').style.display='none';
 $('buy').style.display='block';$('modal').classList.add('show');
}

function close(){ $('modal').classList.remove('show') }

render();

$('category').addEventListener('click',()=>{
 let open=$('menu').hidden;
 $('menu').hidden=!open;
 $('category').setAttribute('aria-expanded',String(open));$('menuSymbol').textContent=open?'×':'☰';
});

$('menu').addEventListener('click',e=>{
 let b=e.target.closest('[data-group]');
 if(!b)return;
 render(b.dataset.group);
 $('menu').hidden=true;
 $('menuSymbol').textContent='☰';$('category').setAttribute('aria-expanded','false');
});

$('close').addEventListener('click',close);$('back').addEventListener('click',close);
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))close()});

$('profileBtn').addEventListener('click',()=>$('loginModal').classList.add('show'));
$('closeLogin').addEventListener('click',()=>$('loginModal').classList.remove('show'));

$('saveLoginBtn').addEventListener('click',()=>{
 let val = $('usernameInput').value.trim();
 if(val){
  loggedUser = val;
  $('profileBtn').textContent = "👤 " + loggedUser;
  $('loginModal').classList.remove('show');
  alert("Successfully logged in as " + loggedUser);
 } else {
  alert("Please enter a valid username.");
 }
});

$('buy').addEventListener('click',()=>{
 let c1 = $('cb1').checked;
 let c2 = $('cb2').checked;
 let c3 = $('cb3').checked;

 $('checkoutStep').style.display='block';$('buy').style.display='none';

 let rawNum = selected.price.replace(/[^0-9.]/g, '');
 if(!rawNum) rawNum = "100";

 let upiLink = `upi://pay?pa=fenixmc@okhdfcbank&pn=FenixMC%20Store&am=${rawNum}&cu=INR&tn=Order%20for%20${loggedUser}%20-%20${encodeURIComponent(selected.name)}`;
 $('upiPayLink').setAttribute('href', upiLink);
});

function triggerDiscordOrder(){
 let c1 = $('cb1').checked;
 let c2 = $('cb2').checked;
 let c3 = $('cb3').checked;

 if(!c1 || !c2 || !c3){
  alert("You must tick all 3 agreement checkboxes before proceeding to payment!");
  return;
 }

 const webhookURL = "https://discord.com/api/webhooks/1555467923018227712/afScYh5i-xPXU1jRTt27EdV94RVLqF0FQFLoyiQIkVO1YslUW7AY-Qt9fmg7OYJuIl75"; 

 const payload = {
  embeds: [{
   title: "🛍️ NEW STORE ORDER & PAYMENT INITIATED!",
   color: 16753165,
   fields: [
    { name: "👤 Minecraft Username", value: loggedUser, inline: true },
    { name: "🎁 Purchased Item", value: selected.name, inline: true },
    { name: "💰 Exact Price", value: selected.price, inline: true },
    { name: "⚡ Payment Method", value: "Direct UPI App (GPay/PhonePe/Paytm)", inline: true },
    { name: "📅 Date & Time", value: new Date().toLocaleString(), inline: false }
   ],
   footer: { text: "FenixMC Store Automated Logging System" }
  ]}
 };

 fetch(webhookURL, {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify(payload)
 }).catch(err => console.log("Webhook error:", err));

 alert("Opening your UPI app with exact amount " + selected.price + "! Order details sent to Discord.");
}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){close(); $('loginModal').classList.remove('show');}});
</script>
</body>
</html>
