<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FenixMC | Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f111a;
            color: #ffffff;
        }
        header {
            background: #161925;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #a855f7;
        }
        .login-box {
            background: #1f2336;
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid #374151;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .login-box b {
            color: #c084fc;
        }
        .hero-section {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(180deg, #161925 0%, #0f111a 100%);
            border-bottom: 1px solid #1f2336;
        }
        .logo-img {
            max-width: 160px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 15px rgba(168, 85, 247, 0.4));
        }
        .stats-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }
        .stat-badge {
            background: #1f2336;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            color: #fbbf24;
            border: 1px solid #374151;
        }
        .category-btn-container {
            padding: 20px;
        }
        .category-toggle {
            background: #1f2336;
            border: 1px solid #374151;
            color: #fbbf24;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            cursor: pointer;
            text-transform: uppercase;
        }
        .container {
            padding: 0 20px 30px 20px;
        }
        .section-title {
            font-size: 18px;
            color: #fbbf24;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .products-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .product-card {
            background: #161925;
            border-radius: 10px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #374151;
            transition: 0.2s;
        }
        .product-card:hover {
            border-color: #a855f7;
        }
        .product-card.green { border-left: 5px solid #22c55e; }
        .product-card.yellow { border-left: 5px solid #eab308; }
        .product-card.blue { border-left: 5px solid #3b82f6; }

        .product-info h4 {
            font-size: 16px;
            margin-bottom: 5px;
            color: #ffffff;
        }
        .product-info .price {
            color: #9ca3af;
            font-size: 14px;
            font-weight: bold;
        }
        .cart-btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div style="font-weight: bold; color: #a855f7; font-size: 18px;">FenixMC</div>
        <div class="login-box" onclick="loginUser()">
            <span id="player-display">👤 Guest</span>
            <b id="login-text">CLICK TO LOGIN</b>
        </div>
    </header>

    <div class="hero-section">
        <!-- Logo image file name -->
        <img src="1000143983.png" alt="FenixMC Logo" class="logo-img" onerror="this.style.display='none'">
        <div class="stats-row">
            <div class="stat-badge">⚡ 2,899 Online</div>
            <div class="stat-badge">🔥 297</div>
        </div>
    </div>

    <div class="category-btn-container">
        <button class="category-toggle">
            ☰ SELECT A CATEGORY
        </button>
    </div>

    <div class="container">
        <h3 class="section-title">Featured Packages</h3>
        
        <div class="products-list">
            <div class="product-card green">
                <div class="product-info">
                    <h4>GOD Rank (+3600 Coins)</h4>
                    <div class="price">27.00 USD</div>
                </div>
                <button class="cart-btn" onclick="checkLogin('GOD Rank')">Buy</button>
            </div>

            <div class="product-card yellow">
                <div class="product-info">
                    <h4>15600 Coins (LIFESTEAL)</h4>
                    <div class="price">12.20 USD</div>
                </div>
                <button class="cart-btn" style="background: #eab308;" onclick="checkLogin('15600 Coins')">Buy</button>
            </div>

            <div class="product-card blue">
                <div class="product-info">
                    <h4>Supreme Rank (+3200 Coins)</h4>
                    <div class="price">22.00 USD</div>
                </div>
                <button class="cart-btn" style="background: #3b82f6;" onclick="checkLogin('Supreme Rank')">Buy</button>
            </div>
        </div>
    </div>

    <script>
        let playerName = "";

        function loginUser() {
            let name = prompt("Enter your Minecraft In-Game Name (Username):");
            if (name && name.trim() !== "") {
                playerName = name.trim();
                document.getElementById("player-display").innerText = "👤 " + playerName;
                document.getElementById("login-text").innerText = "LOGGED IN";
                alert("Successfully logged in as " + playerName + "!");
            }
        }

        function checkLogin(item) {
            if (playerName === "") {
                alert("Please click on 'CLICK TO LOGIN' and enter your Minecraft username first!");
                loginUser();
            } else {
                alert(item + " added to cart for player: " + playerName);
            }
        }
    </script>

</body>
</html>
